<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Remote</title>
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #070a14 0%, #0e1628 50%, #090e1a 100%);
  --glass-bg: rgba(255, 255, 255, 0.07);
  --glass-bg-hover: rgba(255, 255, 255, 0.12);
  --glass-bg-active: rgba(47, 91, 255, 0.35);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-border-light: rgba(255, 255, 255, 0.22);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  --accent: #2f5bff;
  --accent-glow: rgba(47, 91, 255, 0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg-gradient); color: #fff; user-select: none; -webkit-user-select: none; padding-bottom: 76px; min-height: 100vh; }

.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,0.4); opacity: 0; transition: all 0.3s ease; z-index: 1000; pointer-events: none; max-width: 90%; text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { background: #e63946; }

.tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: rgba(13, 19, 34, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; align-items: center; z-index: 200; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #7080a0; font-size: 11px; font-weight: 500; cursor: pointer; border: none; background: none; gap: 4px; }
.tab-item.active { color: var(--accent); }
.tab-item svg { width: 22px; height: 22px; fill: currentColor; }

.view { display: none; padding: 12px 16px; max-width: 440px; margin: 0 auto; }
.view.active { display: block; }

.pad-row { display: flex; gap: 8px; max-width: 280px; margin: 8px auto; }
.dpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 280px; margin: 4px auto; }
.btn-remote { min-height: 56px; border-radius: 16px; border: 1px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; position: relative; flex: 1; box-shadow: 0 4px 16px rgba(0,0,0,0.2); transition: all 0.15s ease; }
.btn-remote:active { background: var(--glass-bg-active); border-color: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }
.btn-remote.ok { background: var(--accent); border-color: rgba(255,255,255,0.3); font-size: 16px; }
.btn-remote.power { background: rgba(230, 57, 70, 0.2); border-color: rgba(230, 57, 70, 0.4); color: #ff6b6b; }
.btn-remote.power:active { background: #e63946; color: #fff; }
.btn-remote svg { width: 22px; height: 22px; fill: currentColor; }

.dot { position: absolute; top: 6px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: #ff4d4d; display: none; }
.btn-remote.has-dot .dot { display: block; }

.swipe-pad { max-width: 280px; height: 100px; margin: 8px auto; background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 2px dashed var(--accent); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #a0b0d0; font-size: 13px; font-weight: 500; gap: 4px; touch-action: none; cursor: pointer; }
.swipe-pad svg { width: 22px; height: 22px; fill: var(--accent); }

.tools-row { display: flex; gap: 8px; max-width: 280px; margin: 8px auto 0; }
.btn-open-tools { flex: 1; min-height: 48px; background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 14px; color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
.btn-open-tools svg { width: 18px; height: 18px; fill: currentColor; }

.quick-apps-header { display: flex; align-items: center; justify-content: space-between; margin: 18px auto 10px; max-width: 300px; }
.quick-apps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto 16px; }
.quick-tile { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; min-height: 88px; transition: all 0.15s ease; }
.quick-tile:active { background: var(--glass-bg-active); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.quick-tile-icon { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: #a0c0ff; }
.quick-tile-name { font-size: 11px; font-weight: 500; color: #d0e0ff; margin-top: 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }

.btn-text { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }

.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 500; }
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13, 19, 34, 0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid var(--glass-border-light); border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 20px; max-width: 500px; margin: 0 auto; transform: translateY(100%); transition: transform 0.28s cubic-bezier(0.1, 0.9, 0.2, 1); z-index: 501; max-height: 85vh; overflow-y: auto; }
.sheet.open { transform: translateY(0); }
.sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid var(--glass-border); padding-bottom: 12px; }
.sheet-title { font-size: 17px; font-weight: 600; color: #fff; }
.sheet-close { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #a0b0d0; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.sheet-close svg { width: 16px; height: 16px; fill: currentColor; }

.section-title { font-size: 12px; font-weight: 600; color: #8090b0; text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 8px; }
.card { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.input-field { width: 100%; min-height: 48px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--glass-border); border-radius: 12px; color: #fff; padding: 0 14px; font-size: 15px; outline: none; user-select: text; -webkit-user-select: text; }
.input-field:focus { border-color: var(--accent); }
.select-field { width: 100%; min-height: 48px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--glass-border); border-radius: 12px; color: #fff; padding: 0 14px; font-size: 15px; outline: none; }

.btn { min-height: 48px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; width: 100%; margin-top: 8px; box-shadow: 0 4px 16px var(--accent-glow); }
.btn-secondary { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #a0b0d0; box-shadow: none; }
.btn-danger { background: rgba(230, 57, 70, 0.2); border: 1px solid rgba(230, 57, 70, 0.4); color: #ff6b6b; box-shadow: none; }

.app-item { display: flex; align-items: center; justify-content: space-between; background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); padding: 12px 16px; border-radius: 16px; margin-bottom: 8px; cursor: pointer; min-height: 56px; transition: all 0.15s ease; }
.app-item:active { background: var(--glass-bg-active); border-color: var(--accent); }
.app-info { display: flex; flex-direction: column; overflow: hidden; margin-right: 12px; }
.app-name { font-size: 15px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-meta { font-size: 12px; color: #7080a0; margin-top: 2px; }

#loginView { max-width: 360px; margin: 60px auto; text-align: center; padding: 24px; background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 24px; }
</style>
</head><body>

<div id="toast" class="toast"></div>

<div id="loginView">
  <h3 style="margin-bottom:12px;color:#fff">Pair Remote</h3>
  <p style="color:#7080a0;font-size:14px;margin-bottom:16px">Enter 4-digit PIN shown on TV</p>
  <input id="pin" type="password" class="input-field" inputmode="numeric" placeholder="PIN" style="text-align:center;letter-spacing:4px">
  <button onclick="go()" class="btn" style="margin-top:16px">Connect</button>
</div>

<div id="mainView" style="display:none">

  <!-- Remote Tab -->
  <div id="view-remote" class="view">

    <!-- Now Playing Glass Card -->
    <div id="nowPlayingCard" class="card" style="display:none">
      <div style="display:flex;align-items:center;gap:12px">
        <img id="npAppIcon" style="width:40px;height:40px;border-radius:10px;object-fit:cover;background:rgba(255,255,255,0.1)">
        <div style="overflow:hidden;flex:1">
          <div id="npTitle" style="font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">--</div>
          <div id="npArtist" style="font-size:12px;color:#a0b0d0;margin-top:2px">--</div>
        </div>
      </div>
      <input type="range" id="npProgress" min="0" max="100" value="0" style="width:100%;margin-top:10px" onchange="seekMedia(this.value)">
      <div style="display:flex;justify-content:space-around;margin-top:8px">
        <button onclick="mediaAct('seek_back')" class="btn-text">⏮ -10s</button>
        <button onclick="mediaAct('prev')" class="btn-text">⏮ Prev</button>
        <button onclick="mediaAct('toggle')" id="npPlayBtn" class="btn-text" style="font-size:16px;font-weight:bold">▶ Play</button>
        <button onclick="mediaAct('next')" class="btn-text">Next ⏭</button>
        <button onclick="mediaAct('seek_fwd')" class="btn-text">+10s ⏭</button>
      </div>
    </div>

    <!-- Sleep Timer Countdown Banner -->
    <div id="sleepCard" class="card" style="display:none;background:rgba(255,100,100,0.15)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span id="sleepTimerText" style="font-size:14px;font-weight:600">Sleep Timer: --</span>
        <div>
          <button onclick="addSleep(15)" class="btn-text">+15m</button>
          <button onclick="cancelSleep()" class="btn-text" style="color:#ff6b6b;margin-left:8px">Cancel</button>
        </div>
      </div>
    </div>

    <div class="dpad-grid" oncontextmenu="return false;">
      <span></span><button id="btnUp" class="btn-remote"><svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></button><span></span>
      <button id="btnLeft" class="btn-remote"><svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg></button>
      <button id="btnOk" class="btn-remote ok">OK</button>
      <button id="btnRight" class="btn-remote"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg></button>
      <span></span><button id="btnDown" class="btn-remote"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button><span></span>
    </div>

    <div id="swipeArea" class="swipe-pad" oncontextmenu="return false;">
      <svg viewBox="0 0 24 24"><path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zM18.8 13c-.45-.45-1.08-.7-1.74-.63-.73.08-1.36.56-1.63 1.25l-.8 2.01c-.13.33-.45.55-.8.55h-4.38c-.37 0-.7-.22-.84-.57l-1.92-4.8c-.28-.7-.98-1.16-1.73-1.16-.99 0-1.8.81-1.8 1.8 0 .28.06.55.19.79l2.76 5.07C6.67 18.8 8.01 20 9.53 20h6.14c1.27 0 2.45-.63 3.16-1.68l2.25-3.37c.39-.58.31-1.37-.28-1.95L18.8 13z"/></svg>
      <span>Swipe or Tap</span>
    </div>

    <div class="pad-row" oncontextmenu="return false;">
      <button id="btnBack" class="btn-remote"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg><span class="dot"></span></button>
      <button id="btnHome" class="btn-remote"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="dot"></span></button>
      <button id="btnPower" class="btn-remote power"><svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.21 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.21-5.18-3.17-6.83z"/></svg><span class="dot"></span></button>
    </div>

    <div class="pad-row" oncontextmenu="return false;">
      <button id="btnVolDown" class="btn-remote"><svg viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg></button>
      <button id="btnVolMute" class="btn-remote"><svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button>
      <button id="btnVolUp" class="btn-remote"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
    </div>

    <div class="tools-row">
      <button onclick="toggleCC()" class="btn-open-tools">Control Center</button>
      <button onclick="toggleSetup()" class="btn-open-tools">Setup Pattern</button>
    </div>

    <!-- Quick Apps Grid Section -->
    <div class="quick-apps-header">
      <span class="section-title" style="margin:0">Quick Apps</span>
      <button class="btn-text" onclick="openEditQuickApps()">Edit</button>
    </div>
    <div id="quickAppsGrid" class="quick-apps-grid"></div>
  </div>

  <!-- Apps Tab -->
  <div id="view-apps" class="view">
    <input type="text" id="q" class="input-field" placeholder="Search apps..." oninput="renderApps()">
    <div id="appsList" style="margin-top:12px"></div>
  </div>

  <!-- Settings Tab -->
  <div id="view-settings" class="view">
    <div class="card">
      <label class="section-title">Sleep Timer</label>
      <select id="sleepChoice" class="select-field" onchange="setSleep(this.value)">
        <option value="0">Off</option>
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="45">45 minutes</option>
        <option value="60">60 minutes</option>
        <option value="90">90 minutes</option>
        <option value="120">120 minutes</option>
        <option value="video_end">End of this video</option>
      </select>
    </div>

    <div class="card">
      <div style="margin-bottom:12px">
        <label class="section-title">Your Name</label>
        <input type="text" id="userName" class="input-field" placeholder="Enter name">
      </div>
      <button onclick="saveSettings()" class="btn">Save Settings</button>
    </div>
  </div>

</div>

<!-- Glass Tab Bar -->
<div class="tab-bar">
  <button class="tab-item active" data-tab="remote" onclick="setTab('remote')">
    Remote
  </button>
  <button class="tab-item" data-tab="apps" onclick="setTab('apps')">
    Apps
  </button>
  <button class="tab-item" data-tab="settings" onclick="setTab('settings')">
    Settings
  </button>
</div>

<script>
let KEY = localStorage.getItem('device_key') || '';
let PIN = sessionStorage.getItem('pin') || '';
let APPS = [], FAVS = [], HIDDEN = [], WALLPAPERS = [];

if (window.PAIRED_KEY) {
  KEY = window.PAIRED_KEY;
  localStorage.setItem('device_key', KEY);
}

if (KEY || PIN) start();

function go() {
  PIN = document.getElementById('pin').value;
  start();
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t.timer);
  t.timer = setTimeout(() => { t.className = 'toast'; }, 2600);
}

function setTab(tabName) {
  document.querySelectorAll('.tab-item').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tabName);
  });
  document.querySelectorAll('.view').forEach(v => {
    v.classList.toggle('active', v.id === 'view-' + tabName);
  });
}

function api(p, o) {
  const auth = 'key=' + encodeURIComponent(KEY) + '&pin=' + encodeURIComponent(PIN);
  const url = p + (p.includes('?') ? '&' : '?') + auth;
  return fetch(url, o);
}

function start() {
  api('/apps').then(r => r.json()).then(a => {
    APPS = a;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display = 'block';
    pollNowPlaying();
    pollSleepStatus();
  });
}

function pollNowPlaying() {
  api('/nowplaying').then(r => r.json()).then(np => {
    const card = document.getElementById('nowPlayingCard');
    if (np.isPlaying || np.title) {
      card.style.display = 'block';
      document.getElementById('npTitle').textContent = np.title || 'Playing';
      document.getElementById('npArtist').textContent = np.artist || '';
      document.getElementById('npPlayBtn').textContent = np.isPlaying ? '⏸ Pause' : '▶ Play';
      if (np.pkg) document.getElementById('npAppIcon').src = '/icon?pkg=' + encodeURIComponent(np.pkg) + '&key=' + encodeURIComponent(KEY);
      if (np.durationMs > 0) {
        document.getElementById('npProgress').max = np.durationMs;
        document.getElementById('npProgress').value = np.positionMs;
      }
    } else {
      card.style.display = 'none';
    }
  }).catch(() => {}).finally(() => setTimeout(pollNowPlaying, 2000));
}

function pollSleepStatus() {
  api('/sleep/status').then(r => r.json()).then(s => {
    const card = document.getElementById('sleepCard');
    if (s.active) {
      card.style.display = 'block';
      const m = Math.floor(s.remainingSec / 60);
      const sec = Math.floor(s.remainingSec % 60);
      document.getElementById('sleepTimerText').textContent = s.isVideoEnd ? 'Sleep: End of video' : `Sleep: ${m}m ${sec}s`;
    } else {
      card.style.display = 'none';
    }
  }).catch(() => {}).finally(() => setTimeout(pollSleepStatus, 3000));
}

function mediaAct(act) {
  api('/media?a=' + act, { method: 'POST' });
}

function seekMedia(val) {
  api('/media?a=seek_to&pos=' + val, { method: 'POST' });
}

function addSleep(m) {
  api('/sleep?min=' + m, { method: 'POST' });
}

function cancelSleep() {
  api('/sleep/cancel', { method: 'POST' });
}

function setSleep(val) {
  if (val === '0') cancelSleep();
  else api('/sleep?min=' + val, { method: 'POST' });
}

function toggleCC() {
  api('/controlcenter', { method: 'POST' }).then(r => {
    if (!r.ok) r.text().then(msg => showToast(msg, true));
  });
}

function toggleSetup() {
  api('/setup', { method: 'POST' });
}

document.getElementById('btnVolUp').addEventListener('click', () => api('/volume?action=up', { method: 'POST' }));
document.getElementById('btnVolDown').addEventListener('click', () => api('/volume?action=down', { method: 'POST' }));
document.getElementById('btnVolMute').addEventListener('click', () => api('/volume?action=mute', { method: 'POST' }));
document.getElementById('btnPower').addEventListener('click', () => api('/power', { method: 'POST' }));
</script></body></html>
